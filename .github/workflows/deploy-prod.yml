name: Deploy Production

on:
  push:
    branches: [master]

# Never cancel a running deploy: cancelling between the Lambda update and
# the rollback step would leave an untested build live. Shared with the
# edge workflow planned in docs/API_CLOUDFRONT_WEB_FUNCTIONS_PLAN.md.
concurrency:
  group: chronas-api-production
  cancel-in-progress: false

permissions:
  contents: write

env:
  AWS_REGION: eu-west-1
  AWS_CLI_VERSION: 2.37.13

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.chronas.org/v1/version

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Load app with Lambda runtime module flags
        # Whether the Web Functions runtime allows require(esm) is not
        # documented, so the app must load with it disabled (#193).
        run: |
          node --no-experimental-require-module --no-experimental-detect-module --input-type=module \
            -e 'process.env.NODE_ENV="test"; process.env.JWT_SECRET="ci"; await import("./config/express.js"); process.exit(0)'

      - name: Lint (check only)
        run: npx eslint '*.js' server config

      - run: npm test

      - name: Integration tests (round-trip writes through real Express + dynalite)
        run: npm run test:integration

      - name: Generate build version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          COMMIT_SHA="${GITHUB_SHA::7}"
          COMMIT_MSG=$(git log -1 --pretty=%s)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > build-version.json << EOF
          {
            "version": "$VERSION",
            "commit": "$COMMIT_SHA",
            "commitMessage": "$COMMIT_MSG",
            "build": "$BUILD_DATE"
          }
          EOF
          echo "Deploying version $VERSION (commit $COMMIT_SHA)"
          cat build-version.json

      - name: Bump patch version
        run: |
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          node -e "
            const fs = require('fs');
            const bv = JSON.parse(fs.readFileSync('build-version.json','utf8'));
            bv.version = '$NEW_VERSION';
            fs.writeFileSync('build-version.json', JSON.stringify(bv, null, 2));
          "
          echo "Bumped to $NEW_VERSION"

      - name: Configure AWS credentials
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }} --profile chronas-prod
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }} --profile chronas-prod
          aws configure set region ${{ env.AWS_REGION }} --profile chronas-prod

      - name: Create deployment package
        run: |
          npm ci --omit=dev
          zip -r lambda-deployment.zip . \
            -x "*.git*" \
            -x "server/tests/*" \
            -x "PostmanTests/*" \
            -x "coverage/*" \
            -x "postman-results*" \
            -x "*.md" \
            -x "*.log" \
            -x ".github/*" \
            -x ".claude/*" \
            -x "eslint.config.js"
          echo "Package size: $(du -h lambda-deployment.zip | cut -f1)"

      # `aws lambda-web` needs CLI >= 2.37.13; the runner's preinstalled CLI may be older.
      - name: Install pinned AWS CLI
        run: |
          curl -sSf -o /tmp/awscliv2.zip "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-${{ env.AWS_CLI_VERSION }}.zip"
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update
          aws --version
          aws lambda-web help > /dev/null

      # Checked before anything changes: failing later would trigger a rollback.
      - name: Check smoke test secret
        env:
          SMOKE_PASSWORD: ${{ secrets.API_SMOKE_PASSWORD }}
        run: |
          if [ -z "$SMOKE_PASSWORD" ]; then
            echo "::error::Repository secret API_SMOKE_PASSWORD is not set"
            exit 1
          fi

      - name: Record the live commit and revision
        id: previous
        run: |
          PREV_COMMIT=$(curl -sf --max-time 20 https://api.chronas.org/v1/version | jq -r '.commit // empty' || true)
          # The revision with the most traffic: after an interrupted canary
          # the endpoint routes to two, in no particular order.
          PREV_REVISION=$(aws lambda-web get-web-function-endpoint --function-name chronas-api --endpoint-name prod \
            --region ${{ env.AWS_REGION }} --profile chronas-prod --query 'sort_by(revisionWeights, &weight)[-1].revisionId' --output text)
          echo "prev_commit=$PREV_COMMIT" >> $GITHUB_OUTPUT
          echo "prev_revision=$PREV_REVISION" >> $GITHUB_OUTPUT
          echo "Live before deploy: commit ${PREV_COMMIT:-unknown}, revision $PREV_REVISION"

      # api.chronas.org → CloudFront → Lambda Web Function "chronas-api"
      # (docs/API_CLOUDFRONT_WEB_FUNCTIONS_PLAN.md). New revision as a
      # canary: 20% of requests go to it, the rest stay on the previous
      # revision, which is also the rollback target.
      - name: Deploy to the Lambda Web Function (canary)
        id: web
        continue-on-error: true
        run: |
          infra/api-edge/web-function.sh deploy lambda-deployment.zip "${GITHUB_SHA::7}" --canary 20 \
            --apply --confirm "deploy chronas-api" > web-deploy.out
          cat web-deploy.out
          cat web-deploy.out >> "$GITHUB_OUTPUT"

      # A revision is Active even when its server fails to start, so only a
      # real response proves the deploy. /v1/version is never edge-cached.
      # At 20%, 60 tries miss a healthy revision with probability 0.8^60
      # (about 1 in 650,000); a miss rolls back, which is the safe side.
      # Failing counts like a Postman failure.
      - name: Check the new revision answers
        id: version
        if: steps.web.outcome == 'success'
        continue-on-error: true
        run: |
          EXPECTED="${GITHUB_SHA::7}"
          for i in $(seq 1 60); do
            LIVE=$(curl -sf --max-time 10 https://api.chronas.org/v1/version | jq -r '.commit // empty' || true)
            if [ "$LIVE" = "$EXPECTED" ]; then echo "The new revision answered (try $i)"; exit 0; fi
            sleep 2
          done
          echo "::error::/v1/version did not report $EXPECTED in 60 tries"
          exit 1

      - name: Move all traffic to the new revision
        id: promote
        if: steps.version.outcome == 'success'
        continue-on-error: true
        run: |
          infra/api-edge/web-function.sh promote "${{ steps.web.outputs.NEW_REVISION }}" \
            --apply --confirm "promote chronas-api"

      # Public map data stays at the edge across deploys: invalidating /v1/*
      # on every deploy emptied the cache and sent the next visitors' bursts
      # to the origin. Put [invalidate-edge] in a commit message (or the PR
      # title, which the merge commit carries) when a public response changes.
      - name: Invalidate CloudFront cache
        id: invalidate
        if: steps.promote.outcome == 'success'
        continue-on-error: true
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          PATHS="/v1/version*"
          if git log --format=%B "$BEFORE_SHA..$GITHUB_SHA" 2>/dev/null | grep -qF '[invalidate-edge]' \
            || git log -1 --format=%B "$GITHUB_SHA" | grep -qF '[invalidate-edge]'; then
            PATHS="/v1/*"
          fi
          echo "Invalidating $PATHS"
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id E1KTIK2H0W8J2Q \
            --paths "$PATHS" \
            --profile chronas-prod \
            --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id E1KTIK2H0W8J2Q \
            --id "$INVALIDATION_ID" \
            --profile chronas-prod
          echo "CloudFront invalidation $INVALIDATION_ID completed"

      - name: Post-deploy Postman smoke tests
        id: postman
        if: steps.invalidate.outcome == 'success'
        continue-on-error: true
        env:
          SMOKE_PASSWORD: ${{ secrets.API_SMOKE_PASSWORD }}
        run: |
          npm install -g newman
          newman run PostmanTests/chronas-enhanced.postman_collection.json \
            -e PostmanTests/chronas-api.postman_environment.json \
            --env-var "smokePassword=$SMOKE_PASSWORD" \
            --timeout-request 60000 \
            --delay-request 500

      # Set the repository variable AUTO_ROLLBACK=false to keep a deploy that
      # fails Postman live (for example when rolling back would restore a
      # build with a known security hole). The run still fails. It applies
      # only after promotion: a canary that never got 100% always rolls back,
      # so the endpoint is never left split between two revisions.
      - name: Keep deployment despite test failure
        if: (steps.invalidate.outcome == 'failure' || steps.postman.outcome == 'failure') && vars.AUTO_ROLLBACK == 'false'
        run: |
          echo "::error::Post-deploy checks FAILED and AUTO_ROLLBACK=false: the new build stays live. Fix forward."
          exit 1

      - name: Roll back the Web Function on test failure
        if: steps.web.outcome == 'failure' || steps.version.outcome == 'failure' || steps.promote.outcome == 'failure' || ((steps.invalidate.outcome == 'failure' || steps.postman.outcome == 'failure') && vars.AUTO_ROLLBACK != 'false')
        run: |
          echo "Deploy or checks FAILED -- moving the endpoint back to ${{ steps.previous.outputs.prev_revision }}"
          infra/api-edge/web-function.sh rollback "${{ steps.previous.outputs.prev_revision }}" \
            --apply --confirm "roll back chronas-api"
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id E1KTIK2H0W8J2Q --paths "/v1/*" \
            --profile chronas-prod --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id E1KTIK2H0W8J2Q --id "$INVALIDATION_ID" --profile chronas-prod
          EXPECTED="${{ steps.previous.outputs.prev_commit }}"
          if [ -n "$EXPECTED" ]; then
            for i in $(seq 1 24); do
              LIVE=$(curl -sf --max-time 10 https://api.chronas.org/v1/version | jq -r '.commit // empty' || true)
              if [ "$LIVE" = "$EXPECTED" ]; then echo "Rollback verified: live commit is $LIVE"; exit 1; fi
              sleep 5
            done
            echo "::error::After rollback, /v1/version still doesn't report $EXPECTED"
          fi
          exit 1

      - name: Verify deployment success
        if: steps.postman.outcome == 'success'
        run: echo "Post-deploy Postman tests passed!"

      - name: Push version bump
        if: steps.postman.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to $(node -p "require('./package.json').version") [skip ci]"
          git push
