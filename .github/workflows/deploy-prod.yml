name: Deploy Production

on:
  push:
    branches: [master]

# Never cancel a running deploy: cancelling between the Lambda update and
# the rollback step would leave an untested build live. Shared with the
# edge workflow planned in docs/API_CLOUDFRONT_WEB_FUNCTIONS_PLAN.md.
concurrency:
  group: chronas-api-production
  cancel-in-progress: false

permissions:
  contents: write

env:
  S3_BUCKET: chronas-lambda-deployments
  AWS_REGION: eu-west-1

jobs:
  # The Lambda Web Functions runtime is Node 24 only (docs/API_CLOUDFRONT_WEB_FUNCTIONS_PLAN.md
  # APP-3). Fail the deploy if the app no longer runs there.
  node24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Load app with Lambda runtime module flags
        run: |
          node --no-experimental-require-module --no-experimental-detect-module --input-type=module \
            -e 'process.env.NODE_ENV="test"; process.env.JWT_SECRET="ci"; await import("./config/express.js"); process.exit(0)'

      - run: npm test

      - run: npm run test:integration

  deploy:
    needs: node24
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.chronas.org/v1/version

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Load app with Lambda runtime module flags
        # The Lambda nodejs22.x runtime disables require(esm). GitHub's Node 22
        # does not, so a CJS dependency that require()s an ESM-only package
        # (sanitize-html 2.18 → htmlparser2 12, #193) passes tests here and
        # crashes every request in prod. Loading the app with Lambda's flags
        # catches that before deploy.
        run: |
          node --no-experimental-require-module --no-experimental-detect-module --input-type=module \
            -e 'process.env.NODE_ENV="test"; process.env.JWT_SECRET="ci"; await import("./config/express.js"); process.exit(0)'

      - name: Lint (check only)
        run: npx eslint '*.js' server config

      - run: npm test

      - name: Integration tests (round-trip writes through real Express + dynalite)
        run: npm run test:integration

      - name: Generate build version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          COMMIT_SHA="${GITHUB_SHA::7}"
          COMMIT_MSG=$(git log -1 --pretty=%s)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > build-version.json << EOF
          {
            "version": "$VERSION",
            "commit": "$COMMIT_SHA",
            "commitMessage": "$COMMIT_MSG",
            "build": "$BUILD_DATE"
          }
          EOF
          echo "Deploying version $VERSION (commit $COMMIT_SHA)"
          cat build-version.json

      - name: Bump patch version
        run: |
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          node -e "
            const fs = require('fs');
            const bv = JSON.parse(fs.readFileSync('build-version.json','utf8'));
            bv.version = '$NEW_VERSION';
            fs.writeFileSync('build-version.json', JSON.stringify(bv, null, 2));
          "
          echo "Bumped to $NEW_VERSION"

      - name: Configure AWS credentials
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }} --profile chronas-prod
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }} --profile chronas-prod
          aws configure set region ${{ env.AWS_REGION }} --profile chronas-prod

      - name: Get Lambda function name
        id: lambda
        run: |
          FUNCTION_NAME=$(aws cloudformation describe-stacks \
            --stack-name ChronasApiLambdaStackV2 \
            --region ${{ env.AWS_REGION }} \
            --profile chronas-prod \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaFunctionName'].OutputValue" \
            --output text)
          echo "function_name=$FUNCTION_NAME" >> $GITHUB_OUTPUT

      - name: Create deployment package
        run: |
          npm ci --omit=dev
          zip -r lambda-deployment.zip . \
            -x "*.git*" \
            -x "server/tests/*" \
            -x "PostmanTests/*" \
            -x "coverage/*" \
            -x "postman-results*" \
            -x "*.md" \
            -x "*.log" \
            -x ".github/*" \
            -x ".claude/*" \
            -x "eslint.config.js"
          echo "Package size: $(du -h lambda-deployment.zip | cut -f1)"

      - name: Ensure S3 bucket exists
        run: |
          aws s3 mb s3://${{ env.S3_BUCKET }} \
            --region ${{ env.AWS_REGION }} \
            --profile chronas-prod 2>/dev/null || true

      # Roll back to the build that is live now. The newest zip in deploys/ is
      # not necessarily it: after a failed deploy was rolled back, the newest
      # zip is the failed build.
      - name: Save previous deployment for rollback
        id: previous
        run: |
          PREV_COMMIT=$(curl -sf --max-time 20 https://api.chronas.org/v1/version | jq -r '.commit // empty' || true)
          echo "Live commit before deploy: ${PREV_COMMIT:-unknown}"
          PREV_KEY=""
          if [ -n "$PREV_COMMIT" ] && aws s3api head-object \
              --bucket ${{ env.S3_BUCKET }} --key "deploys/chronas-api-$PREV_COMMIT.zip" \
              --region ${{ env.AWS_REGION }} --profile chronas-prod >/dev/null 2>&1; then
            PREV_KEY="deploys/chronas-api-$PREV_COMMIT.zip"
          else
            PREV_KEY="deploys/$(aws s3 ls s3://${{ env.S3_BUCKET }}/deploys/ \
              --region ${{ env.AWS_REGION }} \
              --profile chronas-prod | sort | tail -1 | awk '{print $4}')"
            echo "::warning::No zip for the live commit; falling back to the newest zip"
            PREV_COMMIT=""
          fi
          echo "prev_key=$PREV_KEY" >> $GITHUB_OUTPUT
          echo "prev_commit=$PREV_COMMIT" >> $GITHUB_OUTPUT
          echo "Previous deployment: $PREV_KEY"

      # Checked before the Lambda update: failing later would trigger a rollback.
      - name: Check smoke test secret
        env:
          SMOKE_PASSWORD: ${{ secrets.API_SMOKE_PASSWORD }}
        run: |
          if [ -z "$SMOKE_PASSWORD" ]; then
            echo "::error::Repository secret API_SMOKE_PASSWORD is not set"
            exit 1
          fi

      - name: Deploy to Lambda via S3
        run: |
          S3_KEY="deploys/chronas-api-${GITHUB_SHA::7}.zip"
          aws s3 cp lambda-deployment.zip s3://${{ env.S3_BUCKET }}/$S3_KEY \
            --region ${{ env.AWS_REGION }} \
            --profile chronas-prod
          aws lambda update-function-code \
            --function-name ${{ steps.lambda.outputs.function_name }} \
            --s3-bucket ${{ env.S3_BUCKET }} \
            --s3-key $S3_KEY \
            --region ${{ env.AWS_REGION }} \
            --profile chronas-prod \
            --query '{CodeSha256: CodeSha256, LastUpdateStatus: LastUpdateStatus}' \
            --output json
          aws lambda wait function-updated \
            --function-name ${{ steps.lambda.outputs.function_name }} \
            --region ${{ env.AWS_REGION }} \
            --profile chronas-prod
          echo "Lambda deployment completed successfully!"

      - name: Invalidate CloudFront cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id E1KTIK2H0W8J2Q \
            --paths "/v1/*" \
            --profile chronas-prod \
            --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id E1KTIK2H0W8J2Q \
            --id "$INVALIDATION_ID" \
            --profile chronas-prod
          echo "CloudFront invalidation $INVALIDATION_ID completed"

      - name: Warm up Lambda (cold start after deploy)
        run: |
          echo "Sending warmup request to trigger cold start..."
          curl -sf --max-time 60 https://api.chronas.org/v1/health || true
          sleep 5
          echo "Warming DB connection..."
          curl -sf --max-time 60 https://api.chronas.org/v1/flags || true
          curl -sf --max-time 60 https://api.chronas.org/v1/statistics || true
          sleep 3
          echo "Lambda warmed up"

      # Postman only means something once the new build answers. A failure
      # here is treated like a Postman failure (rollback below).
      - name: Check the live version is the new commit
        id: version
        continue-on-error: true
        run: |
          EXPECTED="${GITHUB_SHA::7}"
          for i in $(seq 1 24); do
            LIVE=$(curl -sf --max-time 10 https://api.chronas.org/v1/version | jq -r '.commit // empty' || true)
            if [ "$LIVE" = "$EXPECTED" ]; then echo "Live commit is $LIVE"; exit 0; fi
            echo "Live commit is '${LIVE:-none}', waiting for $EXPECTED ($i/24)"
            sleep 5
          done
          echo "::error::/v1/version did not report $EXPECTED within 2 minutes"
          exit 1

      - name: Post-deploy Postman smoke tests
        id: postman
        if: steps.version.outcome == 'success'
        continue-on-error: true
        env:
          SMOKE_PASSWORD: ${{ secrets.API_SMOKE_PASSWORD }}
        run: |
          npm install -g newman
          newman run PostmanTests/chronas-enhanced.postman_collection.json \
            -e PostmanTests/chronas-api.postman_environment.json \
            --env-var "smokePassword=$SMOKE_PASSWORD" \
            --timeout-request 60000 \
            --delay-request 500

      # Set the repository variable AUTO_ROLLBACK=false to keep a deploy that
      # fails Postman live (for example when rolling back would restore a
      # build with a known security hole). The run still fails.
      - name: Keep deployment despite test failure
        if: (steps.version.outcome == 'failure' || steps.postman.outcome == 'failure') && vars.AUTO_ROLLBACK == 'false'
        run: |
          echo "::error::Postman tests FAILED and AUTO_ROLLBACK=false: the new build stays live. Fix forward."
          exit 1

      - name: Rollback Lambda on test failure
        if: (steps.version.outcome == 'failure' || steps.postman.outcome == 'failure') && vars.AUTO_ROLLBACK != 'false'
        run: |
          echo "Post-deploy checks FAILED -- rolling back Lambda to previous deployment"
          aws lambda update-function-code \
            --function-name ${{ steps.lambda.outputs.function_name }} \
            --s3-bucket ${{ env.S3_BUCKET }} \
            --s3-key ${{ steps.previous.outputs.prev_key }} \
            --region ${{ env.AWS_REGION }} \
            --profile chronas-prod \
            --query '{CodeSha256: CodeSha256, LastUpdateStatus: LastUpdateStatus}' \
            --output json
          aws lambda wait function-updated \
            --function-name ${{ steps.lambda.outputs.function_name }} \
            --region ${{ env.AWS_REGION }} \
            --profile chronas-prod
          echo "Rolled back to ${{ steps.previous.outputs.prev_key }}"
          # Drop edge copies that the failed build may have produced.
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id E1KTIK2H0W8J2Q \
            --paths "/v1/*" \
            --profile chronas-prod \
            --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id E1KTIK2H0W8J2Q \
            --id "$INVALIDATION_ID" \
            --profile chronas-prod
          EXPECTED="${{ steps.previous.outputs.prev_commit }}"
          if [ -n "$EXPECTED" ]; then
            for i in $(seq 1 24); do
              LIVE=$(curl -sf --max-time 10 https://api.chronas.org/v1/version | jq -r '.commit // empty' || true)
              if [ "$LIVE" = "$EXPECTED" ]; then echo "Rollback verified: live commit is $LIVE"; exit 1; fi
              sleep 5
            done
            echo "::error::After rollback, /v1/version still doesn't report $EXPECTED"
          fi
          exit 1

      - name: Verify deployment success
        if: steps.postman.outcome == 'success'
        run: echo "Post-deploy Postman tests passed!"

      - name: Push version bump
        if: steps.postman.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to $(node -p "require('./package.json').version") [skip ci]"
          git push
